<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>10대 실거래 원자재 AI 가격 전망</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --samsung-blue: #1428A0; --bg-color: #f4f7f9; }
    body { background-color: var(--bg-color); font-family: 'Noto Sans KR', sans-serif; padding: 20px; }
    .header-bar { background: var(--samsung-blue); color: white; padding: 15px 25px; border-radius: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
    .nav-pills .nav-link { color: #555; font-weight: 500; border-radius: 8px; margin-right: 5px; cursor: pointer; border: 1px solid #e0e0e0; background: white; padding: 10px 15px; margin-bottom: 8px; }
    .nav-pills .nav-link.active { background-color: var(--samsung-blue) !important; color: white !important; border-color: var(--samsung-blue) !important; }
    .card-custom { background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #e0e0e0; padding: 25px; margin-bottom: 20px; }
    .stat-badge { font-size: 0.85rem; padding: 5px 10px; border-radius: 6px; font-weight: 600; }
    .chart-container { position: relative; height: 420px; width: 100%; }
    .scenario-card { border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; height: 100%; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="header-bar">
      <div>
        <h4 class="m-0 fw-bold">🌐 10대 핵심 원자재 AI 시황 및 6개월 가격 예측</h4>
        <small class="opacity-75">과거 3년 고정밀 실적 + 3대 시나리오별 가격 예측 밴드(Area Shading) 모델</small>
      </div>
      <div id="update-badge" class="badge bg-light text-dark fs-6">기준일: -</div>
    </div>

    <!-- 10종 원자재 탭 네비게이션 (WTI 기본 활성) -->
    <ul class="nav nav-pills mb-4" id="commodityTabs">
      <li class="nav-item"><button class="nav-link active" onclick="switchCommodity('wti', this)">WTI 원유 (CME)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('copper', this)">전기동 (LME)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('aluminum', this)">알루미늄 (LME)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('zinc', this)">아연 (LME 대리)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('nickel', this)">니켈 (LME 대리)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('tungsten', this)">텅스텐 (글로벌대리)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('steel', this)">철강 (글로벌대리)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('gold', this)">금 (LBMA)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="silversilver" onclick="switchCommodity('silver', this)">은 (LBMA)</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('platinum', this)">백금 (CME)</button></li>
    </ul>

    <!-- 메인 대시보드 카드 -->
    <div class="card-custom">
      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 text-muted">야후 파이낸스 실거래 및 AI 3대 시나리오 예측 데이터를 분석 중입니다...</p>
      </div>

      <div id="dashboard-content" style="display: none;">
        <!-- 상단 핵심 KPI 요약 -->
        <div class="row text-center mb-4 g-3">
          <div class="col-md-3">
            <div class="p-3 border rounded bg-light">
              <div class="text-muted small">현재 실거래가</div>
              <h4 class="fw-bold my-1 text-dark" id="kpi-current">-</h4>
              <small class="text-muted" id="kpi-unit">-</small>
            </div>
          </div>
          <div class="col-md-3">
            <div class="p-3 border rounded bg-light">
              <div class="text-muted small">6개월 후 AI 목표가 (Base)</div>
              <h4 class="fw-bold my-1 text-danger" id="kpi-target">-</h4>
              <span id="kpi-rate" class="stat-badge bg-danger text-white">+0.0%</span>
            </div>
          </div>
          <div class="col-md-3">
            <div class="p-3 border rounded bg-light">
              <div class="text-muted small">전망 방향성</div>
              <h4 class="fw-bold my-1 text-primary" id="kpi-direction">-</h4>
              <small class="text-muted">추세 지속</small>
            </div>
          </div>
          <div class="col-md-3">
            <div class="p-3 border rounded bg-light">
              <div class="text-muted small">가격 변동성 지수</div>
              <h4 class="fw-bold my-1 text-warning" id="kpi-volatility">-</h4>
              <small class="text-muted">/ 100 pt</small>
            </div>
          </div>
        </div>

        <!-- 과거 3년 + 미래 3대 시나리오 통합 차트 -->
        <div class="chart-container">
          <canvas id="mainChart"></canvas>
        </div>

        <!-- 하단 AI 3대 시나리오별 상세 예측 근거 리포트 섹션 -->
        <div class="row mt-4" id="scenarios-container">
          <!-- JS로 동적 3단 리포트 카드 생성 -->
        </div>
      </div>
    </div>
  </div>

  <script>
    let globalData = null;
    let currentChart = null;
    let selectedKey = 'wti';

    // GitHub 정적 호스팅 전용 Fetch 파이프라인
    document.addEventListener("DOMContentLoaded", function() {
      const rawUrl = "https://raw.githubusercontent.com/doheecho/market-forecast/refs/heads/main/raw_materials_forecast.json";
      const requestUrl = rawUrl + "?t=" + new Date().getTime(); // 캐시 버스팅

      fetch(requestUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error("HTTP 상태 에러 " + response.status);
          }
          return response.json();
        })
        .then(data => {
          globalData = data;
          document.getElementById("loading").style.display = "none";
          document.getElementById("dashboard-content").style.display = "block";
          document.getElementById("update-badge").innerText = "기준일: " + (globalData.update_date || '-');
          
          renderDashboard(selectedKey);
        })
        .catch(err => {
          document.getElementById("loading").innerHTML = `
            <div class="alert alert-danger" role="alert">
              <strong>데이터 로드 오류:</strong> 깃허브 시황 데이터 원본을 읽어오지 못했습니다.<br>
              <small class="text-muted">상세 에러: ${err.message || err}</small>
            </div>`;
        });
    });

    function switchCommodity(key, btnElement) {
      selectedKey = key;
      document.querySelectorAll("#commodityTabs .nav-link").forEach(el => el.classList.remove("active"));
      if (btnElement) {
        btnElement.classList.add("active");
      }
      renderDashboard(key);
    }

    function renderDashboard(key) {
      if (!globalData || !globalData.forecast_data) return;
      const forecastInfo = globalData.forecast_data[key];
      if (!forecastInfo) {
        console.warn("해당 원자재 데이터가 없습니다: " + key);
        return;
      }

      const historyList = (globalData.history_3y && globalData.history_3y[key]) ? globalData.history_3y[key] : [];
      const forecastBase = forecastInfo.monthly_forecast_base || [];
      const forecastBull = forecastInfo.monthly_forecast_bull || [];
      const forecastBear = forecastInfo.monthly_forecast_bear || [];

      // 통화 단위 포맷 분기화 (한화/센트/달러 기호 매칭)
      const isCent = forecastInfo.unit.includes("US￠") || forecastInfo.unit.includes("￠");
      const currencySign = isCent ? "¢" : "$";

      // 1. KPI 지표 갱신
      document.getElementById("kpi-current").innerText = currencySign + Number(forecastInfo.current_price).toLocaleString();
      document.getElementById("kpi-unit").innerText = forecastInfo.unit;
      document.getElementById("kpi-target").innerText = currencySign + Number(forecastInfo.forecast_6m_target).toLocaleString();
      document.getElementById("kpi-rate").innerText = forecastInfo.forecast_change_rate;
      document.getElementById("kpi-direction").innerText = forecastInfo.direction;
      document.getElementById("kpi-volatility").innerText = forecastInfo.volatility_score;

      // 2. 과거 3년(Daily) + 미래 6개월(3대 시나리오) 시계열 결합
      const allLabels = [];
      const histPrices = [];
      const foreBase = [];
      const foreBull = [];
      const foreBear = [];

      // 과거 데이터 채우기 (Daily)
      historyList.forEach(item => {
        allLabels.push(item.date);
        histPrices.push(item.price);
        foreBase.push(null);
        foreBull.push(null);
        foreBear.push(null);
      });

      // 연결점 처리 (과거 마지막 값에서 시나리오들 시작)
      if (histPrices.length > 0) {
        const lastPrice = histPrices[histPrices.length - 1];
        foreBase[histPrices.length - 1] = lastPrice;
        foreBull[histPrices.length - 1] = lastPrice;
        foreBear[histPrices.length - 1] = lastPrice;
      }

      // 미래 6개월 시나리오 데이터 채우기 (Monthly)
      forecastBase.forEach((item, idx) => {
        allLabels.push(item.month + " (E)");
        histPrices.push(null);
        foreBase.push(item.price);
        foreBull.push(forecastBull[idx] ? forecastBull[idx].price : null);
        foreBear.push(forecastBear[idx] ? forecastBear[idx].price : null);
      });

      // 3. Chart.js 렌더링 (Area Shading 예측 밴드 구현)
      if (currentChart) currentChart.destroy();
      const ctx = document.getElementById('mainChart').getContext('2d');
      
      currentChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: allLabels,
          datasets: [
            {
              label: '과거 3년 실적 (' + forecastInfo.unit + ')',
              data: histPrices,
              borderColor: '#1428A0',
              backgroundColor: 'rgba(20, 40, 160, 0.03)',
              borderWidth: 2,
              pointRadius: 0,
              pointHitRadius: 10,
              pointHoverRadius: 4,
              fill: true,
              tension: 0.1
            },
            {
              label: '낙관 전망 (Bull Scenario)',
              data: foreBull,
              borderColor: '#FF9F43',
              backgroundColor: 'transparent',
              borderWidth: 1.5,
              borderDash: [4, 4],
              pointRadius: 0,
              fill: false,
              tension: 0.2
            },
            {
              label: '비관 전망 (Bear Scenario)',
              data: foreBear,
              borderColor: '#54A0FF',
              backgroundColor: 'rgba(100, 110, 140, 0.05)', // Shading: Bull(Dataset 1)과 Bear(Dataset 2) 사이 음영 채우기
              borderWidth: 1.5,
              borderDash: [4, 4],
              pointRadius: 0,
              fill: '-1',                                    // 바로 위 데이터셋(Bull)과의 사이 영역 채우기 지시!
              tension: 0.2
            },
            {
              label: '기본 전망 (Base Scenario)',
              data: foreBase,
              borderColor: '#DC3545',
              backgroundColor: 'transparent',
              borderWidth: 3,
              pointRadius: 4,
              pointBackgroundColor: '#DC3545',
              pointHoverRadius: 6,
              fill: false,
              tension: 0.2
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          plugins: {
            legend: { position: 'top' },
            tooltip: {
              callbacks: {
                label: function(context) {
                  return context.dataset.label + ': ' + currencySign + Number(context.raw).toLocaleString();
                }
              }
            }
          },
          scales: {
            y: {
              title: { display: true, text: forecastInfo.unit },
              grid: { color: '#f0f0f0' },
              ticks: {
                callback: function(value) {
                  return currencySign + Number(value).toLocaleString();
                }
              }
            },
            x: {
              grid: { display: false },
              ticks: {
                maxRotation: 0,
                font: { size: 10, weight: '500' },
                callback: function(value, index, values) {
                  const label = allLabels[index];
                  if (!label) return '';
                  if (label.includes("(E)")) return label;
                  
                  const dateParts = label.split('-');
                  if (dateParts.length === 3) {
                    const nextLabel = allLabels[index + 1];
                    if (!nextLabel || nextLabel.includes("(E)")) return dateParts[0] + '-' + dateParts[1];
                    const nextDateParts = nextLabel.split('-');
                    if (dateParts[1] !== nextDateParts[1]) return dateParts[0] + '-' + dateParts[1]; // 월말 Ticks 제어
                  }
                  return '';
                }
              }
            }
          }
        }
      });

      // 4. 하단 3대 가격 예측 시나리오 전문 리포트 3단 카드 생성
      const scenariosContainer = document.getElementById("scenarios-container");
      if (scenariosContainer) {
        scenariosContainer.innerHTML = `
          <div class="col-12 mb-3">
            <h5 class="fw-bold text-dark d-flex align-items-center">
              <span class="me-2">📊</span> AI 다변량 시나리오 가격 예측 근거 리포트 (Scenario Report)
            </h5>
          </div>
          <div class="col-md-4 mb-3">
            <div class="scenario-card" style="border-top: 5px solid #DC3545 !important;">
              <h6 class="fw-bold text-danger mb-3 d-flex justify-content-between align-items-center">
                <span>🟢 Base (기본 시나리오)</span>
                <span class="badge bg-danger">확률 50%</span>
              </h6>
              <p class="text-secondary small" style="line-height: 1.6; font-size: 0.92rem; text-align: justify;">
                ${forecastInfo.rationale_base}
              </p>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="scenario-card" style="border-top: 5px solid #FF9F43 !important;">
              <h6 class="fw-bold text-warning mb-3 d-flex justify-content-between align-items-center">
                <span>🟠 Bull (낙관 시나리오)</span>
                <span class="badge bg-warning text-dark">확률 25%</span>
              </h6>
              <p class="text-secondary small" style="line-height: 1.6; font-size: 0.92rem; text-align: justify;">
                ${forecastInfo.rationale_bull}
              </p>
            </div>
          </div>
          <div class="col-md-4 mb-3">
            <div class="scenario-card" style="border-top: 5px solid #54A0FF !important;">
              <h6 class="fw-bold text-primary mb-3 d-flex justify-content-between align-items-center">
                <span>🔵 Bear (비관 시나리오)</span>
                <span class="badge bg-primary">확률 25%</span>
              </h6>
              <p class="text-secondary small" style="line-height: 1.6; font-size: 0.92rem; text-align: justify;">
                ${forecastInfo.rationale_bear}
              </p>
            </div>
          </div>
        `;
      }
    }
  </script>
</body>
</html>
