<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top"><meta charset="utf-8">
  <title>6대 원자재 AI 가격 전망</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --s: #1428A0; }
    body { background:#f4f7f9; font-family:sans-serif; padding:20px; }
    .header-bar { background: var(--s); color:white; padding:15px 25px; border-radius:10px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; }
    .nav-pills .nav-link { color:#555; background:white; border:1px solid #e0e0e0; margin-right:5px; margin-bottom:8px; }
    .nav-pills .nav-link.active { background:var(--s) !important; color:white !important; }
    .card-custom { background:white; border-radius:12px; border:1px solid #e0e0e0; padding:25px; margin-bottom:20px; }
    .advisor-box { background:#f3f5ff; border-left:5px solid var(--s); padding:15px 20px; margin-bottom:20px; font-weight:700; color:var(--s); }
    .range-btn { font-size:0.85rem; padding:5px 14px; border-radius:6px; border:1px solid #dee2e6; background:white; }
    .range-btn.active { background:#555 !important; color:white !important; }
    .scroll-x-container { display:flex; overflow-x:auto; gap:15px; padding-bottom:8px; }
    .metric-card { flex-shrink:0; width:250px; border:1px solid #e9ecef; border-radius:8px; padding:12px; background:#fafbfc; }
    .similarity-box { border:1px solid #dee2e6; border-radius:10px; padding:20px; background:white; margin-bottom:15px; }
    .scenario-card { border:1px solid #dee2e6; border-radius:8px; padding:18px; height:100%; background:white; }
  </style>
</head>
<body>
  <div class="container-fluid">
    <div class="header-bar">
      <div><h4 class="m-0 fw-bold">📊 글로벌 6대 핵심 원자재 AI 가격 전망 및 전략 분석 보고</h4></div>
      <div id="update-badge" class="badge bg-light text-dark fs-6">-</div>
    </div>
    <ul class="nav nav-pills mb-3" id="commodityTabs">
      <li class="nav-item"><button class="nav-link active" onclick="switchCommodity('wti', this)">WTI 원유</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('copper', this)">전기동</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('aluminum', this)">알루미늄</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('gold', this)">금</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('silver', this)">은</button></li>
      <li class="nav-item"><button class="nav-link" onclick="switchCommodity('platinum', this)">백금</button></li>
    </ul>
    <div class="card-custom">
      <div id="loading" class="text-center py-5"><div class="spinner-border text-primary"></div></div>
      <div id="dashboard-content" style="display:none;">
        <div class="advisor-box shadow-sm" id="advisor-block">Planning Advisor : Loading...</div>
        <div class="row text-center mb-4 g-3">
          <div class="col-md-4"><div class="p-3 border rounded bg-light"><small class="text-muted">현재가</small><h4 class="fw-bold my-1 text-dark" id="kpi-current">-</h4><small id="kpi-unit">-</small></div></div>
          <div class="col-md-4"><div class="p-3 border rounded bg-light"><small class="text-muted">6개월 후 AI 목표가</small><h4 class="fw-bold my-1 text-danger" id="kpi-target">-</h4><span id="kpi-rate" class="badge bg-danger">+0%</span></div></div>
          <div class="col-md-4"><div class="p-3 border rounded bg-light"><small class="text-muted">변동성 지수</small><h4 class="fw-bold my-1 text-warning" id="kpi-volatility">-</h4><small class="text-muted">pt</small></div></div>
        </div>
        <div class="mb-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span class="text-secondary fw-bold small">조회 범위 설정 (과거 실적 기간):</span>
          <div class="btn-group" id="rangeButtonGroup">
            <button class="range-btn" onclick="setHistoryRange(36, this)">3년</button>
            <button class="range-btn" onclick="setHistoryRange(24, this)">2년</button>
            <button class="range-btn active" onclick="setHistoryRange(12, this)">1년</button>
            <button class="range-btn" onclick="setHistoryRange(6, this)">6개월</button>
            <button class="range-btn" onclick="setHistoryRange(3, this)">3개월</button>
            <button class="range-btn" onclick="setHistoryRange(1, this)">1개월</button>
          </div>
        </div>
        <div style="position:relative; height:320px; width:100%; margin-bottom:20px;"><canvas id="mainChart"></canvas></div>
        <div class="mb-4">
          <h6 class="fw-bold text-dark mb-2"><i class="bi bi-grid text-primary"></i> 요인지표</h6>
          <div class="scroll-x-container" id="metrics-container"></div>
        </div>
        <div class="row g-3 mb-4" id="scenarios-container"></div>
        <div class="mb-4" id="similarity-section" style="display:none;">
          <h6 class="fw-bold text-dark mb-2"><i class="bi bi-clock-history text-primary"></i> 과거 유사 국면 분석</h6>
          <div class="row" id="similarity-container"></div>
        </div>
        <div class="p-3 border rounded bg-white shadow-sm mb-3" style="border-left:4px solid var(--s);">
          <h6 class="fw-bold text-dark mb-2 border-bottom pb-2">6개월 가격 예측 근거</h6>
          <div id="forecast-rationales-container"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    let globalData=null, currentChart=null, selectedKey='wti', historyMonths=12;

    // GitHub 정적 호스팅 전용 Fetch 파이프라인
    document.addEventListener("DOMContentLoaded", function() {
      const rawUrl = "https://raw.githubusercontent.com/doheecho/market-forecast/refs/heads/main/raw_materials_forecast.json";
      const requestUrl = rawUrl + "?t=" + new Date().getTime(); // 캐시 버스팅
      fetch(requestUrl)
        .then(response => {
          if(!response.ok) throw new Error("HTTP 상태 에러 " + response.status);
          return response.json();
        })
        .then(data => {
          globalData = data;
          document.getElementById("loading").style.display = "none";
          document.getElementById("dashboard-content").style.display = "block";
          document.getElementById("update-badge").innerText = "기준일: " + globalData.update_date;
          renderDashboard(selectedKey);
        })
        .catch(err => {
          document.getElementById("loading").innerHTML = `<div class="alert alert-danger">데이터 로드 오류: ${err.message || err}</div>`;
        });
    });

    function setHistoryRange(m, btn) {
      historyMonths=m;
      document.querySelectorAll("#rangeButtonGroup .range-btn").forEach(el=>el.classList.remove("active"));
      if(btn) btn.classList.add("active");
      renderDashboard(selectedKey);
    }
    function switchCommodity(k, btn) {
      selectedKey=k;
      document.querySelectorAll("#commodityTabs .nav-link").forEach(el=>el.classList.remove("active"));
      if(btn) btn.classList.add("active");
      renderDashboard(k);
    }

    function renderDashboard(k) {
      if(!globalData||!globalData.forecast_data) return;
      const forecastInfo=globalData.forecast_data[k];
      if(!forecastInfo) return;

      const fullHistoryList = globalData.history_3y[k] || [];
      const filterDays = historyMonths * 30; // 월을 대략적인 일수로 변환
      const historyList = fullHistoryList.slice(-filterDays);
      
      const forecastBase = forecastInfo.monthly_forecast_base || [];
      const forecastBull = forecastInfo.monthly_forecast_bull || [];
      const forecastBear = forecastInfo.monthly_forecast_bear || [];
      const forecastList = forecastInfo.monthly_forecast || forecastBase;
      const currencySign = forecastInfo.unit.includes("￠") ? "¢" : "$";

      document.getElementById("advisor-block").innerHTML = forecastInfo.planning_advisor || "-";
      document.getElementById("kpi-current").innerText = currencySign + Number(forecastInfo.current_price).toLocaleString();
      document.getElementById("kpi-target").innerText = currencySign + Number(forecastInfo.forecast_6m_target).toLocaleString();
      document.getElementById("kpi-rate").innerText = forecastInfo.forecast_change_rate;
      document.getElementById("kpi-volatility").innerText = forecastInfo.volatility_score + " pt";

      const allLabels=[], histPrices=[], foreBase=[], foreBull=[], foreBear[];
      
      // 일 단위 가격들을 차트에 주입하여 트렌드 노이즈 완벽 보존!
      historyList.forEach(item => {
        allLabels.push(item.date);
        histPrices.push(item.price);
        foreBase.push(null); foreBull.push(null); foreBear.push(null);
      });

      // 과거 마지막 일단위 가격과 미래 첫 월말 결합
      if(histPrices.length > 0) {
        const lastVal = histPrices[histPrices.length - 1];
        foreBase[histPrices.length - 1] = lastVal;
        foreBull[histPrices.length - 1] = lastVal;
        foreBear[histPrices.length - 1] = lastVal;
      }

      // 미래 6개월 전망가 결합
      forecastBase.forEach((item, idx) => {
        allLabels.push(item.month + " (E)");
        histPrices.push(null);
        foreBase.push(item.price);
        foreBull.push(forecastBull[idx] ? forecastBull[idx].price : null);
        foreBear.push(forecastBear[idx] ? forecastBear[idx].price : null);
      });

      if (currentChart) currentChart.destroy();
      const ctx = document.getElementById('mainChart').getContext('2d');
      currentChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: allLabels,
          datasets: [
            { label: '실적(일단위)', data: histPrices, borderColor: '#1428A0', backgroundColor: 'rgba(20,40,160,0.05)', borderWidth: 1.8, pointRadius: 0, fill: true, tension: 0.4 },
            { label: 'Bull', data: foreBull, borderColor: '#FF9F43', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, tension: 0.4 },
            { label: 'Bear', data: foreBear, borderColor: '#54A0FF', backgroundColor: 'rgba(100,110,140,0.05)', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: '-1', tension: 0.4 },
            { label: 'Base', data: foreBase, borderColor: '#DC3545', borderWidth: 3, pointRadius: 0, fill: false, tension: 0.4 }
          ]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            y: { ticks: { callback: function(v) { return currencySign + Number(v).toLocaleString(); } } },
            x: { ticks: { maxRotation: 0, callback: function(v, i) {
              const label = allLabels[i] || "";
              if (label.includes("(E)") || label.endsWith("-01") || label.endsWith("-15")) return label;
              return "";
            } } }
          }
        }
      });

      // 요인지표 렌더러 (서버 동적 수합 데이터 렌더링)
      const mContainer = document.getElementById("metrics-container");
      if (mContainer) {
        let htmlStr = "";
        (forecastInfo.metrics || []).forEach(m => {
          htmlStr += `
            <div class="metric-card shadow-sm">
              <div class="d-flex justify-content-between align-items-start mb-1" style="font-size: 0.8rem;">
                <span class="fw-bold text-dark text-truncate" style="max-width: 130px;">${m.label}</span>
                <span class="badge bg-${m.badge || 'secondary'}">${m.cat} · ${m.status}</span>
              </div>
              <div class="d-flex justify-content-between align-items-end">
                <span class="fw-bold text-danger" style="font-size: 0.9rem;">${m.val}</span>
                <small class="text-muted" style="font-size: 0.7rem;">${m.date}</small>
              </div>
            </div>`;
        });
        mContainer.innerHTML = htmlStr;
      }

      // 시나리오 렌더러
      const sContainer = document.getElementById("scenarios-container");
      if (sContainer) {
        sContainer.innerHTML = `
          <div class="col-md-4"><div class="scenario-card" style="border-top: 4px solid #DC3545;"><div class="fw-bold text-danger mb-1">기본 시나리오 (Base) [50%]</div><p class="text-secondary small mb-0">${forecastInfo.rationale_base || "-"}</p></div></div>
          <div class="col-md-4"><div class="scenario-card" style="border-top: 4px solid #FF9F43;"><div class="fw-bold text-warning mb-1">낙관 시나리오 (Bull) [25%]</div><p class="text-secondary small mb-0">${forecastInfo.rationale_bull || "-"}</p></div></div>
          <div class="col-md-4"><div class="scenario-card" style="border-top: 4px solid #54A0FF;"><div class="fw-bold text-primary mb-1">비관 시나리오 (Bear) [25%]</div><p class="text-secondary small mb-0">${forecastInfo.rationale_bear || "-"}</p></div></div>`;
      }

      // 과거 유사 국면 오버레이 비교 차트 구현
      const simSection = document.getElementById("similarity-section");
      const simContainer = document.getElementById("similarity-container");
      if (simSection && simContainer) {
        const analogs = forecastInfo.analogs || [];
        if (analogs.length > 0) {
          simSection.style.display = "block";
          let htmlStr = "";
          analogs.forEach((a, idx) => {
            htmlStr += `
              <div class="col-md-6 mb-3">
                <div class="similarity-box shadow-sm">
                  <div class="d-flex justify-content-between align-items-center border-bottom pb-1 mb-2">
                    <h6 class="fw-bold text-dark m-0"><i class="bi bi-diagram-2 me-1"></i>${a.title}</h6>
                    <span class="badge bg-success">유사도 ${a.similarity}</span>
                  </div>
                  <div class="mb-2">
                    <small class="text-muted d-block mb-1" style="font-size:0.75rem; font-weight:700;">분석 기간: ${a.period}</small>
                    <p class="text-secondary small mb-0" style="line-height:1.4; font-size:0.85rem;">${a.summary}</p>
                  </div>
                  <div class="p-1 border rounded bg-light mb-2" style="height: 120px;"><canvas id="miniChart_${idx}"></canvas></div>
                  <div class="d-flex justify-content-between align-items-center pt-2 border-top" style="font-size: 0.8rem;">
                    <div><span class="badge bg-danger">전망 정확도 ${a.acc}</span></div>
                    <div class="d-flex gap-3 text-end">
                      <div><small class="text-muted d-block" style="font-size: 0.65rem;">모델전망</small><span class="fw-bold text-dark">${a.forecast}</span></div>
                      <div><small class="text-muted d-block" style="font-size: 0.65rem;">실제결과</small><span class="fw-bold text-danger">${a.actual}</span></div>
                    </div>
                  </div>
                </div>
              </div>`;
          });
          simContainer.innerHTML = htmlStr;

          analogs.forEach((a, idx) => {
            const mCtx = document.getElementById(`miniChart_${idx}`).getContext('2d');
            const mLabels = Array.from({length: (a.miniHist || []).length + (a.miniForecast || []).length}, (_, i) => (i + 1) + "M");
            
            const histPart = (a.miniHist || []).concat(Array((a.miniForecast || []).length).fill(null));
            const mFore = Array((a.miniHist || []).length).fill(null);
            if ((a.miniHist || []).length > 0) mFore[(a.miniHist || []).length - 1] = a.miniHist[(a.miniHist || []).length - 1];
            
            const currentAiForecast = forecastBase.map(item => item.price);
            const aiForeLine = Array((a.miniHist || []).length - 1).fill(null).concat([a.miniHist[(a.miniHist || []).length - 1] || currentAiForecast[0]]).concat(currentAiForecast);

            new Chart(mCtx, {
              type: 'line',
              data: {
                labels: mLabels,
                datasets: [
                  { label: '과거 실적', data: histPart, borderColor: '#1428A0', borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.3 },
                  { label: '실제 결과', data: mFore.concat(a.miniForecast || []), borderColor: '#2E7D32', borderWidth: 1.5, borderDash: [3,3], pointRadius: 0, fill: false, tension: 0.3 },
                  { label: '현재 AI 전망', data: aiForeLine, borderColor: '#DC3545', borderWidth: 2, pointRadius: 0, fill: false, tension: 0.3 }
                ]
              },
              options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { y: { display: false }, x: { display: false } }
              }
            });
          });
        } else { simSection.style.display = "none"; }
      }

      // 6개월 가격 예측 근거 테이블 렌더러
      const rContainer = document.getElementById("forecast-rationales-container");
      if (rContainer) {
        let htmlStr = `
          <div class="table-responsive">
            <table class="table table-bordered align-middle m-0" style="font-size: 0.85rem;">
              <thead class="table-light text-center">
                <tr><th style="width: 15%;">대상월</th><th style="width: 20%;">전망 가격</th><th style="width: 65%;">예측 근거 및 주요 요인 분석</th></tr>
              </thead>
              <tbody>`;
        (forecastInfo.monthly_forecast_base || forecastBase).forEach(item => {
          htmlStr += `
            <tr>
              <td class="text-center fw-bold text-dark"><span class="badge bg-primary">${item.month} (E)</span></td>
              <td class="text-center fw-bold text-danger">${currencySign}${Number(item.price).toLocaleString()}</td>
              <td class="text-secondary px-3 py-1" style="line-height: 1.4;">${item.rationale || "매크로 요인 및 원자재 스프레드 변동에 따라 예측가가 조율될 것으로 전망됩니다."}</td>
            </tr>`;
        });
        htmlStr += `</tbody></table></div>`;
        rContainer.innerHTML = htmlStr;
      }
    }
  </script>
</body>
</html>
