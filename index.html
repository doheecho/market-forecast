<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>원자재 시황 · 핵심 원자재 AI 가격 전망</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <style>
    :root {
      --bg: #0f1216;
      --panel: #171c23;
      --panel-2: #1e252e;
      --line: #2b333d;
      --text: #e6e9ee;
      --muted: #8b95a1;
      --up: #ef4444;      /* 상승 = 빨강 (국내 관습) */
      --down: #3b82f6;    /* 하락 = 파랑 */
      --accent: #f59e0b;  /* UI 강조색 = 앰버 (AI Advisor·부제와 통일) */
      --green: #22c55e;
      --amber: #f59e0b;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f7f9; --panel: #fff; --panel-2: #f0f2f5; --line: #e2e6eb;
        --text: #1a1f26; --muted: #667085;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg); color: var(--text);
      font: 14px/1.5 -apple-system, "Segoe UI", "Malgun Gothic", Roboto, sans-serif;
      font-variant-numeric: tabular-nums;   /* 숫자 자릿수 세로 정렬 (통계 사이트 느낌) */
    }
    a { color: var(--accent); }

    /* 상단바 + 탭 + AI Advisor 를 한 덩어리로 고정 (엑셀 틀고정) — 내부 간격/위치 그대로 */
    .sticky-head {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg); border-bottom: 1px solid var(--line);
    }
    .sticky-head .wrap { padding-top: 0; padding-bottom: 14px; }

    .topbar {
      display: flex; align-items: baseline; justify-content: space-between;
      flex-wrap: wrap; gap: 8px; padding: 10px 20px; border-bottom: 1px solid var(--line);
    }
    .topbar h1 { font-size: 17px; margin: 0; }
    .topbar .sub { color: var(--amber); font-weight: 700; font-size: 17px; margin-left: 8px; }
    .meta { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .meta button {
      background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
      border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px;
    }
    .meta button:hover { border-color: var(--accent); }

    .wrap { padding: 16px 20px 48px; max-width: 1180px; margin: 0 auto; }

    .tabs {
      display: flex; gap: 6px; margin: 12px 0 12px; flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
    }
    .tabs button {
      background: transparent; border: none; border-bottom: 3px solid transparent;
      color: var(--muted); padding: 10px 14px; cursor: pointer; font-size: 14px;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent); }

    .block {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 10px; padding: 16px; margin-bottom: 16px;
    }
    .block > h3 {
      margin: 0 0 12px; font-size: 13px; color: var(--muted); font-weight: 600;
    }
    #analogBlock h3 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .ana-h-left { display: inline-flex; align-items: center; gap: 8px; }
    .ana-win { display: inline-flex; gap: 4px; }
    .ana-win button {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
      border-radius: 6px; padding: 0 8px; height: 22px; line-height: 1; cursor: pointer;
      font-size: 11px; font-weight: 700;
    }
    .ana-win button:hover:not(:disabled) { border-color: var(--accent); }
    .ana-win button.on {
      color: var(--text); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }
    .ana-win button.off, .ana-win button:disabled {
      color: color-mix(in srgb, var(--muted) 45%, transparent);
      background: transparent; border-style: dashed; border-color: var(--line);
      cursor: not-allowed;
    }
    .analog-nav { display: inline-flex; gap: 4px; }
    .analog-nav button {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
      border-radius: 6px; width: 22px; height: 22px; line-height: 1; cursor: pointer; font-size: 12px;
    }
    .analog-nav button:hover { border-color: var(--accent); }
    .analog-nav button.on {
      color: var(--text); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 16px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
    .card .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .card .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .card .value.up { color: var(--up); }
    .card .value.down { color: var(--down); }
    .card .sub { color: var(--muted); font-size: 11px; margin-top: 2px; }
    .chip {
      display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px;
      border-radius: 999px; margin-left: 6px;
    }
    .chip.up { background: color-mix(in srgb, var(--up) 18%, transparent); color: var(--up); }
    .chip.down { background: color-mix(in srgb, var(--down) 18%, transparent); color: var(--down); }

    .advisor {
      background: color-mix(in srgb, var(--amber) 5%, var(--panel));
      border: 1px solid var(--line); border-left: 3px solid var(--amber);
      border-radius: 8px; padding: 12px 16px; margin: 0;
      color: var(--text); font-weight: 400; white-space: pre-line; line-height: 1.6;
      max-height: 22vh; overflow-y: auto;
    }
    .advisor[hidden] { display: none; }
    .advisor .advisor-tag {
      display: inline-block; font-weight: 700; letter-spacing: .3px;
      margin-right: 6px; color: var(--amber);
    }
    .advisor .advisor-tag::after { content: " :"; }

    .ctl-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; }
    .ctl-lbl { color: var(--muted); font-size: 11px; margin-right: 4px; }
    .ctl-row button {
      background: var(--panel-2); color: var(--muted); border: 1px solid var(--line);
      border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer;
    }
    .ctl-row button:hover { border-color: var(--accent); }
    .ctl-row button.on {
      color: var(--text); border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 16%, var(--panel-2));
    }

    .chart-box { position: relative; height: 340px; width: 100%; }
    .mini-box { position: relative; height: 150px; width: 100%; margin: 4px 0 8px; }

    /* 요인지표: 4칸 그리드, 넘치면 아랫줄로 (가로 스크롤 없음) */
    #metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    @media (max-width: 900px) { #metrics { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { #metrics { grid-template-columns: 1fr; } }
    .scroll-x { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .metric {
      border: 1px solid var(--line); border-radius: 8px; min-width: 0;
      padding: 11px 12px; background: var(--panel-2);
    }
    .metric .top { display: flex; justify-content: space-between; align-items: start; gap: 6px; margin-bottom: 8px; }
    .metric .name { font-weight: 600; font-size: 12px; }
    .metric .val { font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
    .metric .date { color: var(--muted); font-size: 10px; }
    .badge {
      font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 5px; white-space: nowrap;
    }
    .badge.danger { background: color-mix(in srgb, var(--up) 20%, transparent); color: var(--up); }
    .badge.warning { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--amber); }
    .badge.success { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
    .badge.secondary { background: var(--line); color: var(--muted); }

    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    @media (max-width: 780px) { .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    .scenario { border: 1px solid var(--line); border-top: 3px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-2); }
    .scenario .head { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
    .scenario p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    .scenario.base { border-top-color: var(--amber); } .scenario.base .head { color: var(--amber); }
    .scenario.bull { border-top-color: var(--up); }    .scenario.bull .head { color: var(--up); }
    .scenario.bear { border-top-color: var(--down); }  .scenario.bear .head { color: var(--down); }

    .analog { border: 1px solid var(--line); border-radius: 8px; padding: 14px; background: var(--panel-2); }
    .analog .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 8px; }
    .analog .title { font-weight: 700; font-size: 13px; }
    .analog .period { color: var(--muted); font-size: 11px; font-weight: 700; }
    .analog .summary { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin: 0 0 8px; }
    .analog .foot { display: flex; justify-content: space-between; align-items: center; font-size: 12px; padding-top: 8px; border-top: 1px solid var(--line); }
    .analog .foot .kv small { color: var(--muted); font-size: 10px; display: block; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    thead th { color: var(--muted); font-weight: 500; font-size: 11px; }
    td.mono { font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--up); font-weight: 600; }
    td.m { white-space: nowrap; color: var(--muted); }

    .loading, .error { padding: 40px 20px; text-align: center; color: var(--muted); }
    .error { color: var(--up); }
    .src { color: var(--muted); font-size: 11px; margin-top: 8px; }

    /* 출처·갱신 스트립 (푸터) */
    .provenance {
      color: var(--muted); font-size: 11px; line-height: 1.8;
      border-top: 1px solid var(--line); margin-top: 4px; padding-top: 14px;
    }
    .provenance b { color: var(--text); font-weight: 600; }
    .provenance .sep { margin: 0 8px; opacity: .45; }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: stretch; margin-bottom: 16px; }
    .two-col > .block { display: flex; flex-direction: column; margin-bottom: 0; }
    @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
    #scenarios, #analogs { display: flex; flex-direction: column; gap: 12px; flex: 1; }

    /* 6개월 가격 시나리오 표 (7열, 2행 헤더) */
    .tbl-scroll { overflow-x: auto; }
    .scn-table { min-width: 780px; border-collapse: collapse; }
    .scn-table th, .scn-table td {
      border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top;
    }
    .scn-table thead th { text-align: center; color: var(--muted); font-weight: 600; font-size: 11px; background: var(--panel-2); }
    .scn-table th.grp { font-size: 12px; }
    .scn-table th.grp.base { color: var(--amber); }
    .scn-table th.grp.bull { color: var(--up); }
    .scn-table th.grp.bear { color: var(--down); }
    .scn-table .col-month { white-space: nowrap; width: 92px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
    .scn-table td.mono { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; width: 84px; color: var(--text); text-align: right; }
    .scn-table td.why { color: var(--muted); font-size: 12px; line-height: 1.45; min-width: 150px; }

    .toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
      background: var(--panel-2); color: var(--text); border: 1px solid var(--accent);
      border-radius: 999px; padding: 9px 18px; font-size: 13px; z-index: 60;
      box-shadow: 0 6px 20px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div class="sticky-head">
    <header class="topbar">
      <h1>원자재 시황 <span class="sub">핵심 원자재 AI 가격 전망</span></h1>
      <div class="meta">
        <span id="asOf">데이터 로딩 중…</span>
        <button id="refreshBtn" type="button" title="서버의 최신 데이터 파일을 다시 받아옵니다 (워크플로 실행 X)">↻ 새로고침</button>
        <button id="rerunBtn" type="button" title="AI 전망을 지금 새로 생성 (GitHub Actions 실행)">↻ AI 분석 갱신</button>
      </div>
    </header>
    <div class="wrap">
      <nav class="tabs" id="tabs"></nav>
      <div id="advisor" class="advisor" hidden></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <div class="wrap">
    <div id="app"><div class="loading">데이터 로딩 중…</div></div>
    <footer class="provenance" id="provenance" hidden></footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/luxon@3/build/global/luxon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
  <!-- dashboard.js 수정 시 ?v= 값을 바꿔 캐시를 무효화 (GitHub Pages 기본 캐시 10분) -->
  <script src="./dashboard.js?v=20260830i"></script>
</body>
</html>
