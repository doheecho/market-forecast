name: Market Forecasting

on:
  schedule:
    - cron: "0 22 * * 1"   # 매주 월요일 07:00 KST (6개월 전망은 주 1회면 충분)
  workflow_dispatch:        # 필요하면 대시보드의 "↻ AI 분석 갱신" 또는 수동 실행

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate forecast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python analyze.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_materials_forecast.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update forecast ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash origin main
            git push
          fi
