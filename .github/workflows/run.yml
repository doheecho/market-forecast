name: Market Forecasting

on:
  schedule:
    - cron: "0 22 * * 1"   # 매주 월요일 07:00 KST — 6개월 전망은 주 1회만 갱신
  workflow_dispatch:        # 그 외에는 대시보드의 "↻ AI 분석 갱신" 또는 수동 실행으로만
  # CSV(manual/**) 를 고쳐도 여기서 Gemini 전망을 다시 돌리지는 않는다.
  # (시세 반영은 prices.yml 이 manual/** push 로 받아 처리 — 전망은 주 1회 유지)

permissions:
  contents: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20      # Gemini 호출이 멈춰도 20분이면 잡을 끊는다 (기본 6시간 방지)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate forecast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python analyze.py

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_materials_forecast.json snapshots
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update forecast ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash origin main
            git push
          fi
