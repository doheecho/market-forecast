name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "dashboard.js"
      - "raw_materials_forecast.json"
      - "index_github.html"
      - "manifest.webmanifest"
      - "favicon.svg"
      - "icon-*.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # 봇 토큰으로 데이터가 커밋되면 push 이벤트가 안 걸리므로(GitHub 정책),
  # 예보 워크플로 완료 이벤트로도 재배포를 건다.
  workflow_run:
    workflows: ["Market Forecasting", "Update prices"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site
        run: |
          mkdir -p _site
          cp index.html dashboard.js raw_materials_forecast.json _site/
          cp manifest.webmanifest favicon.svg icon-192.png icon-512.png icon-maskable-512.png _site/
          cp index_github.html _site/ 2>/dev/null || true
          test -f _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
