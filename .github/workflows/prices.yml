name: Update prices

on:
  schedule:
    - cron: "30 21 * * 1-5"   # 평일 06:30 KST (미국장 마감 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install "yfinance>=0.2.40" "pandas>=2.0"

      - run: python prices.py

      - name: Commit prices
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_materials_forecast.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: update prices ($(date -u +%Y-%m-%dT%H:%MZ))"
            git pull --rebase --autostash origin main
            git push
          fi
